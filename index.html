<!DOCTYPE html>
<html>
<head>
    <title>Prototype 1 - Sound Pads</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Sound Pads</h1>
    <p>Click a pad to make a sound.</p>

    <div class="grid">
        <button class="pad" onclick="playSound(1)">1</button>
        <button class="pad" onclick="playSound(2)">2</button>
        <button class="pad" onclick="playSound(3)">3</button>

        <button class="pad" onclick="playSound(4)">4</button>
        <button class="pad" onclick="playSound(5)">5</button>
        <button class="pad" onclick="playSound(6)">6</button>

        <button class="pad" onclick="playSound(7)">7</button>
        <button class="pad" onclick="playSound(8)">8</button>
        <button class="pad" onclick="playSound(9)">9</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
